# Development stack for the DevContainer. Credentials here are local-only
# defaults for throwaway containers, never used outside development.
name: repohub-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/RepoHub:cached
      # Linux build output must not mix with the host's macOS .build directories.
      - backend-build:/workspaces/RepoHub/Backend/.build
      - core-build:/workspaces/RepoHub/Packages/RepoHubCore/.build
    environment:
      LOG_LEVEL: debug
      BUILD_COMMIT: devcontainer
      DATABASE_URL: postgres://repohub:repohub@postgres:5432/repohub_dev
      TEST_DATABASE_URL: postgres://repohub:repohub@postgres:5432/repohub_test
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: repohub
      POSTGRES_PASSWORD: repohub
      POSTGRES_DB: repohub_dev
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repohub -d repohub_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend-build:
  core-build:
  postgres-data:
