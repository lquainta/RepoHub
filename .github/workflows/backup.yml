# Nightly encrypted backups of the production database (#34), and a weekly
# test that the latest backup restores. See docs/runbooks/restore.md.
#
# Secrets live in the `backups` environment (protected branches only):
#   FLY_BACKUP_TOKEN    deploy token scoped to the repohub-db app (for `fly ssh`)
#   BACKUP_PASSPHRASE   encryption passphrase; also kept offline by the maintainer
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3
#                       Tigris (Fly object storage) credentials for the bucket
# and the BACKUP_BUCKET variable (s3://repohub-backups/postgres).
name: Database backup

on:
  schedule:
    - cron: "17 9 * * *" # nightly, 09:17 UTC (03:17 in Denver)
    - cron: "47 9 * * 0" # Sundays: also test a restore
  workflow_dispatch:
    inputs:
      restore-test:
        description: Also restore the latest backup into a scratch database
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up production
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * *'
    runs-on: ubuntu-latest
    environment: backups
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DEST: ${{ vars.BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Dump the database
        # pg_dump runs on the database machine, so its version always matches
        # the server, and connects as the operator over the local socket.
        run: |
          flyctl ssh console --app repohub-db --command \
            "sh -c 'PGPASSWORD=\$OPERATOR_PASSWORD pg_dump -h localhost -U postgres -d repohub --format=custom'" \
            > "$RUNNER_TEMP/repohub.dump"
      - name: Encrypt, upload, and prune backups older than 14 days
        run: scripts/backup-db.sh "$RUNNER_TEMP/repohub.dump"
      - name: Summary
        run: aws s3 ls "${BACKUP_DEST%/}/" | tail -14 | awk '{print "- " $4 " (" $3 " bytes)"}' >> "$GITHUB_STEP_SUMMARY"

  restore-test:
    name: Restore the latest backup
    needs: [backup]
    if: >-
      always() && needs.backup.result != 'failure'
      && (github.event.schedule == '47 9 * * 0' || inputs.restore-test)
    runs-on: ubuntu-latest
    environment: backups
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: repohub
          POSTGRES_PASSWORD: repohub
          POSTGRES_DB: repohub_restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repohub -d repohub_restore"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DEST: ${{ vars.BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: auto
      TARGET: postgres://repohub:repohub@localhost:5432/repohub_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Restore
        run: scripts/restore-db.sh latest "$TARGET"
      - name: Check the restored data
        run: |
          psql "$TARGET" -v ON_ERROR_STOP=1 -qc 'ANALYZE'
          psql "$TARGET" -v ON_ERROR_STOP=1 -tA -F ' | ' -c "
            SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname" > counts.txt
          grep -q '^users |' counts.txt || { echo '::error::The restore has no users table'; exit 1; }
          migrations=$(psql "$TARGET" -tAc 'SELECT count(*) FROM _fluent_migrations')
          test "$migrations" -gt 0
          { echo "Restored the latest backup: $migrations migrations applied."; echo; echo '```'; cat counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
