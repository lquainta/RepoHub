name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  core-macos:
    name: Core (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/RepoHubCore/.build
          key: core-macos-${{ hashFiles('Packages/RepoHubCore/Package.swift', 'Packages/RepoHubCore/Package.resolved') }}
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: make test-core

  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/RepoHubCore/.build
          key: core-linux-${{ hashFiles('Packages/RepoHubCore/Package.swift', 'Packages/RepoHubCore/Package.resolved') }}
      - name: Test
        run: swift test --package-path Packages/RepoHubCore

  app:
    name: App (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: xcodebuild -version && xcodegen --version
      - name: Build and test
        run: make test-app RESULT_BUNDLE=build/app-unit.xcresult
      - name: Report test failures
        if: failure()
        run: scripts/xcresult-failures.sh build/app-unit.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unit-xcresult
          path: build/app-unit.xcresult
          retention-days: 7

  app-ui:
    name: App UI tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: UI tests
        run: make test-ui RESULT_BUNDLE=build/app-ui.xcresult
      - name: Report test failures
        if: failure()
        run: scripts/xcresult-failures.sh build/app-ui.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-ui-xcresult
          path: build/app-ui.xcresult
          retention-days: 7

  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Backend/.build
          key: backend-linux-${{ hashFiles('Backend/Package.resolved') }}
          restore-keys: backend-linux-
      - name: Build
        run: swift build --package-path Backend --build-tests
      - name: Test
        run: swift test --package-path Backend --skip-build

  devcontainer:
    name: DevContainer
    runs-on: ubuntu-latest
    env:
      # Compose's bake builder rejects the devcontainer CLI's generated
      # Dockerfile (outside the build context) without an fs.read entitlement.
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build DevContainer and run checks inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -e
            make test-core test-backend lint format-check check-env
            pg_isready -d "$DATABASE_URL"
            redis-cli -u "$REDIS_URL" ping
