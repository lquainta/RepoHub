name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  core-macos:
    name: Core (macOS)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/RepoHubCore/.build
          key: core-macos-${{ hashFiles('Packages/RepoHubCore/Package.swift', 'Packages/RepoHubCore/Package.resolved') }}
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test with coverage
        run: scripts/package-coverage.sh Packages/RepoHubCore coverage/core.lcov
      - name: Coverage summary
        run: |
          percent=$(awk -F: '/^LF:/ {f += $2} /^LH:/ {h += $2} END {printf "%.1f%%", h * 100 / f}' coverage/core.lcov)
          echo "**Core line coverage:** $percent" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/core.lcov
          flags: core
          use_oidc: true
          fail_ci_if_error: false

  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/RepoHubCore/.build
          key: core-linux-${{ hashFiles('Packages/RepoHubCore/Package.swift', 'Packages/RepoHubCore/Package.resolved') }}
      - name: Test
        run: swift test --package-path Packages/RepoHubCore

  app:
    name: App (macOS)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: xcodebuild -version && xcodegen --version
      - name: Build and test
        run: make test-app RESULT_BUNDLE=build/app-unit.xcresult DERIVED_DATA=build/DerivedData
      - name: Export coverage
        run: scripts/app-coverage.sh build/DerivedData coverage/app.lcov
      - name: Coverage summary
        run: |
          percent=$(awk -F: '/^LF:/ {f += $2} /^LH:/ {h += $2} END {printf "%.1f%%", h * 100 / f}' coverage/app.lcov)
          echo "**App line coverage:** $percent" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/app.lcov
          flags: app
          use_oidc: true
          fail_ci_if_error: false
      - name: Report test failures
        if: failure()
        run: scripts/xcresult-failures.sh build/app-unit.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unit-xcresult
          path: build/app-unit.xcresult
          retention-days: 7

  app-ui:
    name: App UI tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: UI tests
        run: make test-ui RESULT_BUNDLE=build/app-ui.xcresult
      - name: Report test failures
        if: failure()
        run: scripts/xcresult-failures.sh build/app-ui.xcresult
      - name: Show app logs and crash reports
        if: failure()
        run: |
          log show --last 15m --style compact --predicate 'process == "RepoHub"' | tail -n 150 || true
          found=false
          for report in ~/Library/Logs/DiagnosticReports/RepoHub*; do
            [ -f "$report" ] || continue
            found=true
            echo "== $report"
            head -n 60 "$report"
          done
          $found || echo "No RepoHub crash reports"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-ui-xcresult
          path: build/app-ui.xcresult
          retention-days: 7

  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    container:
      image: swift:6.4-noble
    services:
      # Throwaway databases for this job only: migrations are checked on one,
      # integration tests run on the other.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: repohub
          POSTGRES_PASSWORD: repohub
          POSTGRES_DB: repohub_test
        options: >-
          --health-cmd "pg_isready -U repohub -d repohub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://repohub:repohub@postgres:5432/repohub_test
      MIGRATION_CHECK_URL: postgres://repohub:repohub@postgres:5432/repohub_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Backend/.build
          key: backend-linux-${{ hashFiles('Backend/Package.resolved') }}
          restore-keys: backend-linux-
      - name: Install PostgreSQL client
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Check migrations (migrate -> revert -> migrate on a clean database)
        run: |
          psql "$TEST_DATABASE_URL" -qc "CREATE DATABASE repohub_migrations"
          DATABASE_URL="$MIGRATION_CHECK_URL" scripts/check-migrations.sh
      - name: Test with coverage (unit and PostgreSQL integration tests)
        run: scripts/package-coverage.sh Backend coverage/backend.lcov
      - name: Coverage summary
        run: |
          percent=$(awk -F: '/^LF:/ {f += $2} /^LH:/ {h += $2} END {printf "%.1f%%", h * 100 / f}' coverage/backend.lcov)
          echo "**Backend line coverage:** $percent" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Codecov uploader dependencies
        # The Swift image lacks gpg, which codecov-action needs to verify its uploader.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl gnupg
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/backend.lcov
          flags: backend
          use_oidc: true
          fail_ci_if_error: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Backend/Dockerfile
          build-args: BUILD_COMMIT=${{ github.sha }}
          tags: repohub-backend:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: Smoke test the image
        run: |
          # /health doesn't touch the database, so a placeholder URL is enough.
          docker run -d --name api -p 8080:8080 \
            -e "DATABASE_URL=postgres://repohub@localhost:5432/unused?sslmode=disable" repohub-backend:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health | grep -q '"status":"ok"'
          curl -fsS localhost:8080/health | grep -q "\"commit\":\"${GITHUB_SHA}\""
          test "$(docker exec api id -u)" != "0"
          for _ in $(seq 1 20); do
            [ "$(docker inspect api --format '{{.State.Health.Status}}')" = healthy ] && break; sleep 3
          done
          test "$(docker inspect api --format '{{.State.Health.Status}}')" = healthy
          docker images repohub-backend:ci --format '**Backend image:** {{.Size}} uncompressed' >> "$GITHUB_STEP_SUMMARY"
      - name: Show container logs
        if: failure()
        run: docker logs api || true

  devcontainer:
    name: DevContainer
    runs-on: ubuntu-latest
    env:
      # Compose's bake builder rejects the devcontainer CLI's generated
      # Dockerfile (outside the build context) without an fs.read entitlement.
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build DevContainer and run checks inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -e
            make test-core test-backend lint format-check check-env
            scripts/test-git-hooks.sh
            pg_isready -d "$DATABASE_URL"
            redis-cli -u "$REDIS_URL" ping
