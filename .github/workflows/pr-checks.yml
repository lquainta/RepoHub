name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            docs
            ci
            chore
            refactor
            perf
            build
          scopes: |
            app
            core
            backend
            ci
            docs
            deps
          requireScope: false

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    # Bot PRs (Dependabot, release automation) are not tied to an issue
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const pattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (!pattern.test(body)) {
              core.setFailed(
                "PR body must link an issue with a closing keyword, e.g. 'Closes #42'. See CONTRIBUTING.md."
              );
            } else {
              core.info(`Found linked issue: ${body.match(pattern)[0]}`);
            }
