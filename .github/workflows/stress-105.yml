# TEMPORARY experiment for #105, removed before merge. Loops the Linux core
# test suite on x86_64 with the current code (main) and with the fix.
name: Stress 105

on:
  push:
    branches: [fix/105-linux-pipe-inheritance]

permissions:
  contents: read

jobs:
  stress:
    name: Stress (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container:
      image: swift:6.4-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: main
          - variant: after
            ref: fix/105-linux-pipe-inheritance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Build tests
        run: swift build --package-path Packages/RepoHubCore --build-tests
      - name: Run the suite 100 times
        run: |
          fails=0
          for i in $(seq 1 100); do
            if ! out=$(swift test --package-path Packages/RepoHubCore --skip-build 2>&1); then
              fails=$((fails + 1))
              echo "run $i failed:"
              echo "$out" | grep -E 'failed after' | grep 'Test "' | head -4
            fi
          done
          echo "${{ matrix.variant }}: $fails/100 runs failed" | tee -a "$GITHUB_STEP_SUMMARY"
