# Local backend stack: PostgreSQL, Redis, migrations, and the API.
#
#   cp .env.sample .env    # optional; compose works without it
#   docker compose up --build
#   curl localhost:8080/health
#
# Credentials here are local-only defaults for throwaway containers. Never use
# them outside development. Production configuration is in docs/deployment.md.
name: repohub

x-backend: &backend
  build:
    context: .
    dockerfile: Backend/Dockerfile
    args:
      BUILD_COMMIT: ${BUILD_COMMIT:-compose}
  image: repohub-backend:compose
  env_file:
    - path: .env
      required: false
  environment:
    # Containers reach each other by service name, not localhost.
    DATABASE_URL: postgres://repohub:${POSTGRES_PASSWORD:-repohub}@postgres:5432/repohub_dev?sslmode=disable
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: repohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repohub}
      POSTGRES_DB: repohub_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repohub -d repohub_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then exits. The API waits for it.
  migrate:
    <<: *backend
    command: ["migrate", "--yes"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
