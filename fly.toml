# Fly.io configuration for the backend (ADR 0007, ADR 0010).
# Deploy from the repository root:
#   fly deploy --ha=false --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD)
# (--ha=false: one machine; Fly otherwise adds a second for high availability.)
# Secrets (DATABASE_URL, REDIS_URL, keys) are set with `fly secrets`, never here.

app = "repohub-backend"
primary_region = "dfw"

[build]
  dockerfile = "Backend/Dockerfile"

[deploy]
  # Runs in a temporary machine with the new image before any traffic moves to
  # it. If a migration fails, the deploy stops and the old version keeps serving.
  release_command = "migrate --yes"
  strategy = "rolling"

[env]
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: webhooks (#77) and the uptime monitor (#53) need a running
  # instance, and one small machine fits the budget.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
