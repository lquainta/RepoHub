openapi: 3.1.0
info:
  title: RepoHub API
  version: 0.1.0
  summary: Backend for the RepoHub macOS app.
  description: |
    The RepoHub backend adds GitHub sign-in, pull request and CI data, and sync
    across Macs to the RepoHub app. Local repository status never leaves the Mac.

    This document is the source of truth for the API ([ADR 0008](https://github.com/lquainta/RepoHub/blob/main/docs/adr/0008-design-the-api-spec-first.md)):
    the backend's route handlers and the app's client are generated from it,
    so a change here that the code doesn't follow fails to compile.

    Errors use Vapor's format: `{"error": true, "reason": "..."}`.

    ## Authentication

    Sign-in uses GitHub's [device flow](https://docs.github.com/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps#device-flow),
    run by the backend so the GitHub token never reaches the app:

    1. `POST /auth/device` returns a code to show the user and a GitHub URL to enter it at.
    2. The app polls `POST /auth/device/token` every `interval` seconds until the user approves.
    3. The response is a **session**: a short-lived access token (JWT, sent as
       `Authorization: Bearer`) and a refresh token for `POST /auth/refresh`.
       Refresh tokens rotate: each one works once.

    Every operation requires a valid access token unless it lists `security: []`.

    ## Limits

    Requests are rate limited per client IP (stricter for `/auth`) and per
    user; over the limit, the API answers `429` with `Retry-After`. Request
    bodies are limited to 64 KB (1 MB for webhooks).
  license:
    name: MIT
    url: https://github.com/lquainta/RepoHub/blob/main/LICENSE
  contact:
    url: https://github.com/lquainta/RepoHub
servers:
  - url: https://repohub-backend.fly.dev
    description: Production
  - url: http://localhost:8080
    description: Local development (`make up` or `make run-backend`)
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness checks for monitoring and deploys.
  - name: Auth
    description: GitHub sign-in and sessions.
  - name: Account
    description: The signed-in user.
  - name: GitHub
    description: Pull request and CI status for the user's repositories.
  - name: Sync
    description: Groups and settings synced between a user's Macs.
  - name: Activity
    description: Daily activity history for the chart.
  - name: Webhooks
    description: Events from GitHub.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness check
      description: |
        Returns `ok` while the process is serving requests. Doesn't touch the
        database or Redis, so it stays up even when they're down; use it to
        decide whether to restart the process.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.1.0
                commit: 3f89e9c
  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness check
      description: |
        Checks that the server can reach PostgreSQL and Redis. Load balancers
        and the uptime monitor use it to stop sending traffic to, or alert
        on, an instance that can't serve requests. Each check has a short
        timeout, so a hung dependency fails fast instead of hanging the probe.
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /auth/device:
    post:
      operationId: startDeviceSignIn
      tags: [Auth]
      summary: Start signing in with GitHub
      description: Returns a code for the user to enter at `verificationURI`.
      security: []
      responses:
        "200":
          description: Show `userCode` and open `verificationURI`, then poll for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GitHubUnavailable"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /auth/device/token:
    post:
      operationId: pollDeviceSignIn
      tags: [Auth]
      summary: Finish signing in with GitHub
      description: |
        Poll every `interval` seconds. While the user hasn't approved, the
        response is `202`. Once they do, the response is a session for this
        device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "202":
          description: Not approved yet; poll again after `interval` seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingSignIn"
        "400":
          description: The code expired, the user denied access, or the request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GitHubUnavailable"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Get a new access token
      description: Exchanges a refresh token for a new session. The refresh token can't be used again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/signout:
    post:
      operationId: signOut
      tags: [Auth]
      summary: Sign this device out
      description: |
        Revokes this device's session. Signing out the last device also deletes
        the stored GitHub token.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me:
    get:
      operationId: getCurrentUser
      tags: [Account]
      summary: The signed-in user
      responses:
        "200":
          description: The user's GitHub profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /github/status:
    post:
      operationId: getRepositoryStatuses
      tags: [GitHub]
      summary: Pull requests and CI for a batch of repositories
      description: |
        For each repository: its open pull requests (marking the ones that
        request the user's review) and the combined status of the check runs
        on `branch`, if given.

        Responses come from a per-user Redis cache (pull requests for 60
        seconds, check runs for 30) and are revalidated with ETags, so
        polling doesn't use up the user's GitHub rate limit. Webhooks clear a
        repository's cache when its pull requests or checks change.

        A repository that fails (for example, one the user can't see) is
        returned with an `error`; the others are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryStatusRequest"
      responses:
        "200":
          description: One result per requested repository, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryStatusList"
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /events:
    get:
      operationId: streamEvents
      tags: [GitHub]
      summary: Live updates for the user's repositories
      description: |
        A [server-sent events](https://html.spec.whatwg.org/multipage/server-sent-events.html)
        stream. When a GitHub webhook reports a change (check runs, check
        suites, or pull requests) to a repository the user has asked about
        with `POST /github/status`, the server sends a `repository` event
        whose data is a `RepositoryChanged` object. The app then asks for that
        repository's status again.

        A `keep-alive` event without data is sent every 25 seconds. The server ends the
        stream after 10 minutes; reconnect with a fresh access token.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
                description: "`repository` events whose `data` is JSON matching `RepositoryChanged`."
                contentSchema:
                  $ref: "#/components/schemas/RepositoryChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [Sync]
      summary: The user's synced groups and settings
      description: |
        Returns the user's workspace (created on first use): its settings and
        its groups. With `since`, only groups changed after that time are
        returned, including deleted ones (`deletedAt` set) so the Mac can
        remove them too. Pass the previous response's `serverTime` as `since`.
      parameters:
        - name: since
          in: query
          required: false
          description: Only return groups changed after this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncedWorkspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateWorkspaceSettings
      tags: [Sync]
      summary: Change the synced settings
      description: Last write wins. A change older than the stored settings is ignored, and the stored settings are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncedSettings"
      responses:
        "200":
          description: The settings now stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncedSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /workspace/groups/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        description: Chosen by the Mac that created the group.
        schema:
          type: string
          format: uuid
    put:
      operationId: putGroup
      tags: [Sync]
      summary: Create or update a group
      description: |
        Last write wins: a change whose `updatedAt` isn't later than the
        stored group's is ignored, and the stored group is returned.
        Members are remote identities (see `SyncedGroup`); repositories are
        created in the workspace as needed. A group that another Mac already
        created with the same name is merged into it: the response then has
        that group's ID, which the Mac should adopt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncedGroup"
      responses:
        "200":
          description: The group now stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncedGroup"
        "400":
          description: The group is invalid (for example, the ID doesn't match the path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteGroup
      tags: [Sync]
      summary: Delete a group
      description: |
        Marks the group deleted at `deletedAt`, unless it changed after that.
        Its repositories stay in the workspace.
      parameters:
        - name: deletedAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "204":
          description: Deleted (or already deleted, or not found).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /activity:
    get:
      operationId: getActivity
      tags: [Activity]
      summary: Daily activity for the user's repositories
      description: |
        Commits per day and whether each repository had uncommitted changes,
        for every repository in the user's workspace with snapshots in the
        last `days` days (ending today, UTC). Days without a snapshot are
        omitted; the app shows them as zero.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: The activity, one series per repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /activity/snapshots:
    post:
      operationId: uploadSnapshots
      tags: [Activity]
      summary: Upload daily snapshots
      description: |
        Stores one snapshot per repository and day, replacing an earlier
        upload of the same day. `dirty`, `ahead`, and `behind` describe the
        moment of capture, so the app sends them only for today; when they're
        absent, a stored value is kept. Repositories are identified by their
        remote identity and added to the workspace as needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotUpload"
      responses:
        "204":
          description: Stored.
        "400":
          description: The upload is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags: [Webhooks]
      summary: Receive a GitHub webhook delivery
      description: |
        Authenticated by GitHub's HMAC-SHA256 signature of the raw body
        (`X-Hub-Signature-256`) with the shared webhook secret, not by a bearer
        token. Deliveries with a missing or wrong signature are rejected. A
        redelivered `X-GitHub-Delivery` is accepted but not processed twice.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=` followed by the hex HMAC of the body."
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted (or already received).
        "400":
          description: The delivery is missing its repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from a session (`POST /auth/device/token` or `POST /auth/refresh`). Expires after 15 minutes.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until requests are accepted again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotConfigured:
      description: This server isn't configured for the feature (for example, no GitHub client ID).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GitHubUnavailable:
      description: GitHub couldn't be reached or returned an unexpected response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      description: The running build.
      required: [status, version, commit]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: RepoHubCore version.
          example: 0.1.0
        commit:
          type: string
          description: Git commit of the running build (`BUILD_COMMIT`), or `unknown`.
          example: 3f89e9c
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required: [database, cache]
          properties:
            database:
              $ref: "#/components/schemas/DependencyCheck"
            cache:
              $ref: "#/components/schemas/DependencyCheck"
    DependencyCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: integer
          description: How long the check took, in milliseconds.
        error:
          type: string
          description: Why the check failed. Never contains credentials.
    DeviceAuthorization:
      type: object
      required: [deviceCode, userCode, verificationURI, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: Pass back to `POST /auth/device/token`. Don't show it to the user.
        userCode:
          type: string
          description: The code the user enters on GitHub.
          example: WDJB-MJHT
        verificationURI:
          type: string
          format: uri
          example: https://github.com/login/device
        expiresIn:
          type: integer
          description: Seconds until the code expires.
          example: 899
        interval:
          type: integer
          description: Minimum seconds between polls.
          example: 5
    DeviceTokenRequest:
      type: object
      required: [deviceCode, deviceName]
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 200
        deviceName:
          type: string
          description: Shown in the user's list of signed-in devices.
          minLength: 1
          maxLength: 100
          example: Ada's MacBook Pro
    PendingSignIn:
      type: object
      required: [status, interval]
      properties:
        status:
          type: string
          enum: [pending, slowDown]
          description: "`slowDown` means polling too often: use the new `interval`."
        interval:
          type: integer
          example: 5
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 200
    Session:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: "JWT for the `Authorization: Bearer` header."
        refreshToken:
          type: string
          description: Single-use. Store it in the Keychain.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [id, login]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: octocat
        name:
          type: string
          example: The Octocat
        avatarURL:
          type: string
          format: uri
    Error:
      type: object
      description: Vapor's error response.
      required: [error, reason]
      properties:
        error:
          type: boolean
          const: true
        reason:
          type: string
          description: A human-readable explanation. Never contains secrets.
    RepositoryStatusRequest:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/RepositoryReference"
    RepositoryReference:
      type: object
      required: [owner, name]
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 100
          example: octocat
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: hello-world
        branch:
          type: string
          description: The local branch whose check runs to report. Omit for a detached HEAD.
          minLength: 1
          maxLength: 255
          example: main
    RepositoryStatusList:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryGitHubStatus"
    RepositoryGitHubStatus:
      type: object
      required: [owner, name, pullRequests]
      properties:
        owner:
          type: string
        name:
          type: string
        pullRequests:
          type: array
          description: Open pull requests, newest first. Empty when `error` is set.
          items:
            $ref: "#/components/schemas/PullRequestSummary"
        checks:
          $ref: "#/components/schemas/CheckSummary"
        error:
          type: string
          enum: [notFound, unauthorized, rateLimited, unavailable]
          description: |
            Why GitHub data isn't available: `notFound` (missing or not
            visible to the user), `unauthorized` (sign in again),
            `rateLimited`, or `unavailable` (GitHub error).
    PullRequestSummary:
      type: object
      required: [number, title, url, author, isDraft, headBranch, reviewRequested]
      properties:
        number:
          type: integer
          example: 42
        title:
          type: string
        url:
          type: string
          format: uri
        author:
          type: string
          example: octocat
        isDraft:
          type: boolean
        headBranch:
          type: string
        reviewRequested:
          type: boolean
          description: Whether the signed-in user is a requested reviewer.
    CheckSummary:
      type: object
      description: The combined result of the check runs on the requested branch's latest commit. Absent when there are none.
      required: [state, total, failed, pending, url]
      properties:
        state:
          type: string
          enum: [success, failure, pending]
          description: "`failure` if any run failed, otherwise `pending` if any is still running, otherwise `success`."
        total:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        url:
          type: string
          format: uri
          description: The failing run if there is one, otherwise the most recent run.
    RepositoryChanged:
      type: object
      description: Data of a `repository` event.
      required: [owner, name, event]
      properties:
        owner:
          type: string
        name:
          type: string
        event:
          type: string
          description: The GitHub event that caused it.
          enum: [check_run, check_suite, pull_request, pull_request_review, push]
    SyncedWorkspace:
      type: object
      required: [serverTime, settings, groups]
      properties:
        serverTime:
          type: string
          format: date-time
          description: Pass as `since` on the next request.
        settings:
          $ref: "#/components/schemas/SyncedSettings"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SyncedGroup"
    SyncedSettings:
      type: object
      required: [updatedAt]
      properties:
        staleBranchDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: Days without commits before a branch is stale; `0` turns the check off. Absent means the app's default.
        updatedAt:
          type: string
          format: date-time
          description: When the settings were changed, by the Mac's clock.
    SyncedGroup:
      type: object
      required: [id, name, sortOrder, members, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        sortOrder:
          type: integer
        members:
          type: array
          maxItems: 1000
          description: |
            Remote identities of the member repositories: `host/path`,
            lowercased, without scheme, user, or `.git` (for example
            `github.com/owner/repo`).
          items:
            type: string
            minLength: 1
            maxLength: 500
        updatedAt:
          type: string
          format: date-time
          description: When the group was changed, by the Mac's clock.
        deletedAt:
          type: string
          format: date-time
          description: Set when the group was deleted.
    Snapshot:
      type: object
      required: [repository, day, commits]
      properties:
        repository:
          type: string
          minLength: 1
          maxLength: 500
          description: The remote identity, such as `github.com/owner/repo`.
        day:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The calendar day on the Mac, `YYYY-MM-DD`.
          example: "2026-10-21"
        commits:
          type: integer
          minimum: 0
        dirty:
          type: boolean
        ahead:
          type: integer
          minimum: 0
        behind:
          type: integer
          minimum: 0
    SnapshotUpload:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/Snapshot"
    ActivityHistory:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryActivity"
    RepositoryActivity:
      type: object
      required: [repository, name, days]
      properties:
        repository:
          type: string
          description: The remote identity.
        name:
          type: string
        days:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/ActivityDay"
    ActivityDay:
      type: object
      required: [day, commits, dirty]
      properties:
        day:
          type: string
          example: "2026-10-21"
        commits:
          type: integer
        dirty:
          type: boolean
